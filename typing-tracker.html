<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трекер слепой печати</title>
<style>
  :root {
    --paper: #EDEAE2;
    --ink: #23262B;
    --ink-soft: #5B5E63;
    --keycap: #FFFFFF;
    --keycap-border: #D3CFC2;
    --en: #3D5A80;
    --en-bg: #E4EAF2;
    --ru: #9A6735;
    --ru-bg: #F2E8DA;
    --kk: #4F7A4A;
    --kk-bg: #E4EEE2;
    --danger: #B3452F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 24px; }

  .keyrow { display: flex; gap: 6px; margin-bottom: 20px; }
  .key {
    flex: 1;
    background: var(--keycap);
    border: 1px solid var(--keycap-border);
    border-bottom: 3px solid var(--keycap-border);
    border-radius: 6px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    user-select: none;
    transition: transform 0.06s ease;
  }
  .key.active { color: #fff; border-bottom-width: 1px; transform: translateY(2px); }
  .key[data-lang="en"].active { background: var(--en); border-color: var(--en); }
  .key[data-lang="ru"].active { background: var(--ru); border-color: var(--ru); }
  .key[data-lang="kk"].active { background: var(--kk); border-color: var(--kk); }
  .key:active { transform: translateY(2px); }

  .card {
    background: var(--keycap);
    border: 1px solid var(--keycap-border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin: 0 0 14px;
    font-weight: 600;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 110px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--keycap-border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--en); }
  button.submit {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.submit:active { transform: scale(0.99); }
  .error { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box { background: var(--paper); border-radius: 8px; padding: 12px 10px; text-align: center; }
  .stat-box .lang-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-box[data-lang="en"] .lang-name { color: var(--en); }
  .stat-box[data-lang="ru"] .lang-name { color: var(--ru); }
  .stat-box[data-lang="kk"] .lang-name { color: var(--kk); }
  .stat-box .big { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .stat-box .small { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .bar-row .d { width: 70px; color: var(--ink-soft); flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; background: var(--paper); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .bar-fill[data-lang="en"] { background: var(--en); }
  .bar-fill[data-lang="ru"] { background: var(--ru); }
  .bar-fill[data-lang="kk"] { background: var(--kk); }
  .bar-val { width: 30px; text-align: right; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }

  .log-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--paper);
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0;
  }
  .tag[data-lang="en"] { background: var(--en-bg); color: var(--en); }
  .tag[data-lang="ru"] { background: var(--ru-bg); color: var(--ru); }
  .tag[data-lang="kk"] { background: var(--kk-bg); color: var(--kk); }
  .log-item .meta { flex: 1; color: var(--ink-soft); }
  .log-item .num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .log-item .del { cursor: pointer; color: var(--ink-soft); font-size: 16px; padding: 0 4px; }
  .empty { color: var(--ink-soft); font-size: 13px; text-align: center; padding: 20px 0; }
  .loading { color: var(--ink-soft); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Клавиатурный трекер</h1>
  <p class="sub">Kaz &middot; Rus &middot; Eng &mdash; слепая печать</p>

  <div class="card">
    <h2>Новая тренировка</h2>
    <div class="keyrow" id="langPicker">
      <div class="key" data-lang="en">EN</div>
      <div class="key" data-lang="ru">RU</div>
      <div class="key" data-lang="kk">KK</div>
    </div>
    <div class="row">
      <div class="field">
        <label>Дата</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>Сайт / тренажёр</label>
        <input type="text" id="fSite" placeholder="keybr, typerun...">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Минут</label>
        <input type="number" id="fMin" placeholder="30" min="1">
      </div>
      <div class="field">
        <label>Слов/мин (WPM)</label>
        <input type="number" id="fWpm" placeholder="25" min="0">
      </div>
      <div class="field">
        <label>Точность %</label>
        <input type="number" id="fAcc" placeholder="95" min="0" max="100">
      </div>
    </div>
    <button class="submit" id="addBtn">Добавить запись</button>
    <div class="error" id="formError"></div>
  </div>

  <div class="card">
    <h2>Итоги по языкам</h2>
    <div class="stats-grid" id="statsGrid">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <div class="card">
    <h2>Прогресс WPM (последние записи)</h2>
    <div id="barChart"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="card">
    <h2>История</h2>
    <div id="logList"><div class="loading">Загрузка...</div></div>
  </div>
</div>

<script>
let selectedLang = 'en';
let entries = [];
const LANG_NAMES = { en: 'English', ru: 'Русский', kk: 'Қазақша' };
const STORAGE_KEY = 'typing-entries';

document.getElementById('langPicker').addEventListener('click', (e) => {
  const key = e.target.closest('.key');
  if (!key) return;
  selectedLang = key.dataset.lang;
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('active', k.dataset.lang === selectedLang));
});
document.querySelector('.key[data-lang="en"]').classList.add('active');
document.getElementById('fDate').value = new Date().toISOString().slice(0,10);

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }
  render();
}

function saveEntries() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {
    console.error('Storage error', e);
  }
}

document.getElementById('addBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('formError');
  const date = document.getElementById('fDate').value;
  const site = document.getElementById('fSite').value.trim();
  const min = parseFloat(document.getElementById('fMin').value);
  const wpm = parseFloat(document.getElementById('fWpm').value);
  const acc = parseFloat(document.getElementById('fAcc').value);

  if (!date || !min || min <= 0) {
    errEl.textContent = 'Укажите дату и количество минут';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  entries.push({
    id: Date.now(),
    lang: selectedLang,
    date, site,
    minutes: Math.round(min),
    wpm: isNaN(wpm) ? null : Math.round(wpm),
    accuracy: isNaN(acc) ? null : Math.round(acc)
  });
  entries.sort((a,b) => a.date.localeCompare(b.date));
  saveEntries();
  document.getElementById('fSite').value = '';
  document.getElementById('fMin').value = '';
  document.getElementById('fWpm').value = '';
  document.getElementById('fAcc').value = '';
  render();
});

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function render() {
  renderStats();
  renderChart();
  renderLog();
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  const langs = ['en','ru','kk'];
  grid.innerHTML = langs.map(l => {
    const list = entries.filter(e => e.lang === l);
    const totalMin = list.reduce((s,e) => s + e.minutes, 0);
    const wpmList = list.filter(e => e.wpm !== null).map(e => e.wpm);
    const avgWpm = wpmList.length ? Math.round(wpmList.reduce((a,b)=>a+b,0)/wpmList.length) : null;
    return `<div class="stat-box" data-lang="${l}">
      <div class="lang-name">${LANG_NAMES[l]}</div>
      <div class="big">${avgWpm !== null ? avgWpm : '—'}</div>
      <div class="small">ср. WPM</div>
      <div class="small">${totalMin} мин, ${list.length} зан.</div>
    </div>`;
  }).join('');
}

function renderChart() {
  const el = document.getElementById('barChart');
  const withWpm = entries.filter(e => e.wpm !== null).slice(-8);
  if (!withWpm.length) {
    el.innerHTML = '<div class="empty">Добавь WPM в записи, чтобы увидеть график</div>';
    return;
  }
  const maxWpm = Math.max(...withWpm.map(e => e.wpm), 10);
  el.innerHTML = withWpm.map(e => {
    const pct = Math.round((e.wpm / maxWpm) * 100);
    const d = e.date.slice(5);
    return `<div class="bar-row">
      <div class="d">${d} ${e.lang.toUpperCase()}</div>
      <div class="bar-track"><div class="bar-fill" data-lang="${e.lang}" style="width:${pct}%"></div></div>
      <div class="bar-val">${e.wpm}</div>
    </div>`;
  }).join('');
}

function renderLog() {
  const el = document.getElementById('logList');
  if (!entries.length) {
    el.innerHTML = '<div class="empty">Пока нет записей — добавь первую тренировку выше</div>';
    return;
  }
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  el.innerHTML = sorted.map(e => `
    <div class="log-item">
      <span class="tag" data-lang="${e.lang}">${e.lang}</span>
      <span class="meta">${e.date}${e.site ? ' · ' + e.site : ''} · ${e.minutes} мин</span>
      <span class="num">${e.wpm !== null ? e.wpm + ' wpm' : ''}${e.accuracy !== null ? ' / ' + e.accuracy + '%' : ''}</span>
      <span class="del" data-id="${e.id}">&times;</span>
    </div>
  `).join('');
  el.querySelectorAll('.del').forEach(d => {
    d.addEventListener('click', () => deleteEntry(Number(d.dataset.id)));
  });
}

loadEntries();
</script>

<!--
Заметка для GitHub Pages:
Файл автономный — открывается напрямую в браузере, зависимостей нет.
Данные хранятся в localStorage браузера (на устройстве пользователя),
поэтому у каждого посетителя будет своя, отдельная история записей.
-->

</body>
</html>
